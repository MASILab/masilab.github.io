# See https://just-the-docs.com/docs/configuration/

title: MASI Lab Gallery
description: A list of tools available from the MASI Lab!
theme: just-the-docs

url: https://masilab.github.io
baseurl: ""

logo: "/assets/images/masi_logo_light.png"

# Vanderbilt-branded color scheme, defined in _sass/color_schemes/masi.scss
color_scheme: masi
favicon_ico: "/assets/images/favicon.ico"

permalink: pretty 

# Add search bar
search_enabled: true

# Add mermaid diagrams, may be useful for Snakemake flowcharts
mermaid:
  version: "9.1.3"

# Aux links for the upper right navigation
aux_links:
  "MASI Lab - Vanderbilt University":
    - "https://my.vanderbilt.edu/masi/"

# Makes Aux links open in a new tab
aux_links_new_tab: true

# Navigation sidebar
nav_enabled: true

# Have anchor links on page
heading_anchors: true

# Footer
footer_content: "&copy; 2026 MASI Lab"

# Add callouts that can be used like this: 
# {: .warning}
# Here's a warning!
# Colors below are brand ramps defined in _sass/custom/setup.scss
# (highlight / sky / sage), not just-the-docs' stock red/blue/green.
callouts:
  warning:
    title: Warning
    color: highlight
  note:
    title: Note
    color: sky
  citation:
    title: Citation
    color: sage